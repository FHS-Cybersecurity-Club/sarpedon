name: sarpedon

services:
  mongo:
    image: docker.io/library/mongo@sha256:01354084d2ae665d2e79b79b0cdc50c2c0c98873618912d9a2c8c9cb5c3d24e6
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sarpedon:
    image: ghcr.io/fhs-cybersecurity-club/sarpedon@sha256:cff3a16d7d24c535943d434153eb6e060c568deb912a9f7f20d7b93b601f76f9
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017
      GIN_MODE: release
    volumes:
      - type: bind
        source: ./sarpedon.conf
        target: /app/sarpedon.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend
      - edge

  cloudflared:
    image: docker.io/cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    depends_on:
      sarpedon:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env before starting the stack}
    networks:
      - edge

  authentik-proxy:
    image: ghcr.io/goauthentik/proxy@sha256:0d1ef18bc60d67199e983e5ee7b8be61e945fa223f5525b4c3a1a2525b21ca76
    container_name: ak-outpost-sarpedon
    restart: unless-stopped
    depends_on:
      sarpedon:
        condition: service_started
    env_file:
      - ./.authentik-outpost.env
    environment:
      AUTHENTIK_HOST: https://auth.knightscyber.org
      AUTHENTIK_HOST_BROWSER: https://auth.knightscyber.org
      AUTHENTIK_INSECURE: "false"
    networks:
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  mongo-data:
    name: sarpedon_mongo-data
